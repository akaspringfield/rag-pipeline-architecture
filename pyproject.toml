[project]
name = "rag-platform"
version = "0.1.0"
description = "Production-ready Retrieval-Augmented Generation (RAG) platform with hybrid retrieval, conversation persistence, and Groq-powered LLM inference."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Core RAG
    "langchain>=1.2.15",
    "langchain-core>=1.3.2",
    "langchain-community>=0.4.1",
    "langchain-chroma>=1.1.0",
    "langchain-groq>=1.1.2",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",

    # LangGraph
    "langgraph>=1.1.10",

    # Vector DB & Embeddings
    "chromadb>=1.5.8",
    "sentence-transformers>=5.4.1",

    # Data Processing
    "pandas>=3.0.2",
    "numpy>=2.4.4",

    # PDF Processing
    "pypdf>=6.13.2",
    "fpdf2>=2.8.7",

    # API & Web
    "fastapi>=0.136.3",
    "uvicorn>=0.46.0",

    # Database
    "sqlalchemy>=2.0.49",
    "sqlalchemy-utils>=0.42.1",
    "psycopg2>=2.9.12",
    "alembic>=1.18.4",

    # Background Tasks
    "celery>=5.6.3",
    "redis>=8.0.0",

    # Retrieval
    "rank-bm25>=0.2.2",

    # UI
    "streamlit>=1.56.0",

    # Configuration
    "python-dotenv>=1.2.2",
]

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

